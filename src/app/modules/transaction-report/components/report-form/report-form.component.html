<ion-header translucent>
  <ion-toolbar color="primary">
    <ion-title>Transaction</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
    <ion-list>
       <ion-item lines="full">
         <ion-label position="floating">Name</ion-label>
         <ion-input type="text" formControlName="name"></ion-input>
       </ion-item>
      <ion-item lines="full">
        <ion-label position="floating">Date</ion-label>
        <ion-input type="date" formControlName="date"></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Amount</ion-label>
        <ion-input type="number" formControlName="amount"></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label>Type</ion-label>
        <ion-radio-group formControlName="type">
          <ion-item>
            <ion-label>IN</ion-label>
            <ion-radio value="IN"></ion-radio>
          </ion-item>
          <ion-item>
            <ion-label>OUT</ion-label>
            <ion-radio value="OUT"></ion-radio>
          </ion-item>
        </ion-radio-group>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Voucher Number</ion-label>
        <ion-input type="text" formControlName="voucherNumber"></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Description</ion-label>
        <ion-input type="text" formControlName="description"></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Remark</ion-label>
        <ion-input type="text" formControlName="remark"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button type="submit" expand="block" [disabled]="!transactionForm.valid">Add Transaction</ion-button>
  </form>
</ion-content>
